<style>
/* Layout concept: a road atlas. Sign-board green header, milestone stones for real sequences,
   info-blue for charging, one yellow used only for stone tops and the active-tab marker. */
:root{
  --font-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-n:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#EFF2EE; --surface:#FFFFFF; --surface2:#E6EBE5; --ink:#11202A; --ink2:#41525D; --muted:#576570; --line:#D2D9D1;
  --nh:#0A6B4B; --nh2:#0C7F59; --on-nh:#FFFFFF; --info:#0B4EA2; --on-info:#FFFFFF; --stone:#F2B705;
  --good:#0A7A3C; --good-bg:#DCEFE3; --warn:#8A5A00; --warn-bg:#FBEFCF; --bad:#B42B23; --bad-bg:#F8DDDA; --info-bg:#DDE8F7;
  --s1:#2a78d6; --s2:#eb6834; --s1-soft:#b7d3f6;
  --map-land:#D9E1D8; --map-line:#F6F8F5; --route:#C6372E;
  --shadow:0 1px 2px rgba(17,32,42,.06),0 4px 14px rgba(17,32,42,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141B; --surface:#141F29; --surface2:#1C2A36; --ink:#EAF0F2; --ink2:#B7C4CB; --muted:#8A9AA4; --line:#26384A;
    --nh:#0B6B4B; --nh2:#118A60; --info:#6BA2F0; --on-info:#0C141B; --info-bg:#172B47;
    --good:#4FCB82; --good-bg:#12301F; --warn:#F2B705; --warn-bg:#35290A; --bad:#FF7A70; --bad-bg:#3A1816;
    --s1:#3987e5; --s2:#d95926; --s1-soft:#1c5cab;
    --map-land:#1F2E3A; --map-line:#0C141B; --route:#FF7A70; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#141F29; --surface2:#1C2A36; --ink:#EAF0F2; --ink2:#B7C4CB; --muted:#8A9AA4; --line:#26384A;
  --nh:#0B6B4B; --nh2:#118A60; --info:#6BA2F0; --on-info:#0C141B; --info-bg:#172B47;
  --good:#4FCB82; --good-bg:#12301F; --warn:#F2B705; --warn-bg:#35290A; --bad:#FF7A70; --bad-bg:#3A1816;
  --s1:#3987e5; --s2:#d95926; --s1-soft:#1c5cab;
  --map-land:#1F2E3A; --map-line:#0C141B; --route:#FF7A70; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-b);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nh);z-index:60}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:clamp(30px,5.4vw,44px)} h3{font-size:clamp(22px,3.6vw,27px)} h4{font-size:19px;letter-spacing:.02em}
p{margin:0 0 12px;max-width:68ch} ul,ol{margin:0 0 12px;padding-left:22px} li{margin-bottom:5px;max-width:68ch}
a{color:var(--info)} a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--stone);outline-offset:2px;border-radius:6px}
b,strong{font-weight:600}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--font-n);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.kicker{font:600 13px var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar: the NH direction board */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nh);color:var(--on-nh)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;white-space:nowrap}
.sign{display:inline-flex;align-items:center;border:2px solid #fff;border-radius:7px;padding:2px 9px 3px;font:700 24px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase;outline:3px solid var(--nh);outline-offset:-5px}
.brand small{font:500 13px var(--font-b);opacity:.9;display:none}
.tabs{display:none;margin-left:auto;gap:4px}
.tabs a{color:var(--on-nh);text-decoration:none;font:600 17px var(--font-d);letter-spacing:.06em;text-transform:uppercase;padding:17px 12px 13px;border-bottom:4px solid transparent}
.tabs a:hover{background:rgba(255,255,255,.1)} .tabs a[aria-current="page"]{border-bottom-color:var(--stone)}
@media(min-width:900px){.tabs{display:flex}.brand small{display:inline}.bottomnav{display:none!important}main{padding-bottom:60px!important}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);text-decoration:none;font:600 11.5px var(--font-d);letter-spacing:.06em;text-transform:uppercase;padding:6px 0;border-radius:10px;min-width:0}
.bottomnav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bottomnav a[aria-current="page"]{color:var(--info);background:var(--info-bg)}
main{padding-block:22px 110px}
.view[hidden]{display:none}

/* intro band */
.intro{display:grid;gap:18px;margin-bottom:8px}
.intro h1{font-size:clamp(38px,8vw,70px);text-transform:uppercase;letter-spacing:.01em}
.intro p.lead{font-size:clamp(17px,2.4vw,20px);color:var(--ink2);max-width:60ch}
.jump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:0 -2px;scrollbar-width:thin}
.jump button{flex:none}
.sec{margin-top:44px;scroll-margin-top:84px}
.sec>header{margin-bottom:16px}
.sec>header p{color:var(--ink2);margin-top:8px}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid.w3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.cols2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:820px){.cols2{grid-template-columns:1fr 1fr}.cols2.lop{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.card>:last-child{margin-bottom:0}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.tinted{background:var(--surface2);border-radius:12px;padding:14px 16px}
.note{border-radius:12px;padding:12px 14px;font-size:15px;max-width:none}
.note p:last-child{margin-bottom:0}
.note.good{background:var(--good-bg)} .note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)} .note.info{background:var(--info-bg)}
.note .lbl{font:700 13px var(--font-d);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:3px}
.note.good .lbl{color:var(--good)} .note.warn .lbl{color:var(--warn)} .note.bad .lbl{color:var(--bad)} .note.info .lbl{color:var(--info)}

/* controls */
.btn{font:600 16px var(--font-b);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink2)} .btn.pri{background:var(--nh);color:var(--on-nh);border-color:var(--nh)} .btn.pri:hover{background:var(--nh2)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14.5px}
.chip{font:600 14.5px var(--font-b);border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 13px;cursor:pointer;min-height:38px;white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--info);border-color:var(--info);color:var(--on-info)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:600 14.5px var(--font-b);border:0;background:transparent;color:var(--ink2);padding:9px 13px;cursor:pointer;min-height:42px}
.seg button+button{border-left:1.5px solid var(--line)} .seg button[aria-pressed="true"]{background:var(--info);color:var(--on-info)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lab{font:600 13px var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .val{font:500 17px var(--font-n);color:var(--ink)}
select,input[type=number],input[type=search],input[type=text]{font:500 16px var(--font-b);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--info);height:32px;margin:0}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;max-width:none}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--info);flex:none}
.check span{min-width:0}
.check input:checked+span{color:var(--muted);text-decoration:line-through}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12.5px var(--font-d);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 13px var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0} td.r,th.r{text-align:right} td.n{font-family:var(--font-n);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface2)}

/* milestone stone: used only for real sequences */
.stone{flex:none;width:54px;border:1.5px solid var(--ink2);border-radius:9px 9px 4px 4px;overflow:hidden;background:var(--surface);text-align:center}
.stone i{display:block;height:13px;background:var(--stone)}
.stone b{display:block;font:700 26px/1 var(--font-d);padding:5px 0 6px}
.steps{display:grid;gap:14px;list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:14px;align-items:flex-start;max-width:none;margin:0}
.steps li>div{min-width:0}
.steps h4{margin-bottom:3px}

/* stat readouts */
.stat{display:grid;gap:2px}
.stat .v{font:500 30px/1.1 var(--font-n);font-variant-numeric:tabular-nums}
.stat .l{font:600 13px var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font:500 clamp(30px,6vw,46px)/1.05 var(--font-n);font-variant-numeric:tabular-nums}

/* details */
details{border-bottom:1px solid var(--line)} details>summary{cursor:pointer;padding:12px 2px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details>summary::-webkit-details-marker{display:none} details>summary::after{content:"+";font:500 22px var(--font-n);color:var(--muted)} details[open]>summary::after{content:"-"}
details>div{padding:0 2px 14px;color:var(--ink2)}
details>div p{max-width:70ch}

/* car cards */
.cars{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.car{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:grid;gap:10px;align-content:start;min-width:0}
.car.pick{border:2px solid var(--nh)}
.car h4{font-size:22px;line-height:1.1;margin:0} .car .br{font:600 12.5px var(--font-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.car .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.car .facts div{min-width:0} .car .facts b{display:block;font:500 17px var(--font-n);font-variant-numeric:tabular-nums} .car .facts span{font:600 11.5px var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rangebar{position:relative;height:12px;border-radius:6px;background:var(--surface2)}
.rangebar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--s1-soft)} .rangebar i+i{background:var(--s1)}
.car.detail-open .more{display:block}
.more{display:none;border-top:1px solid var(--line);padding-top:10px;font-size:14.5px;color:var(--ink2)}
.more dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px} .more dt{color:var(--muted)} .more dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cmpbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30}
@media(min-width:900px){.cmpbar{bottom:14px}}

/* picks */
.pickcard{display:grid;gap:10px;align-content:start}
.pickcard .band{font:700 14px var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:var(--nh)}
:root[data-theme="dark"] .pickcard .band{color:#4FCB82}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pickcard .band{color:#4FCB82}}
.pickcard h3{font-size:30px}
.alts{display:grid;gap:4px;font-size:14.5px;color:var(--ink2);padding-top:8px;border-top:1px solid var(--line)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-b);fill:var(--ink2);font-size:12px}
.chart .t1{fill:var(--ink);font-weight:600} .chart .axis{stroke:var(--line);stroke-width:1} .chart .grid{stroke:var(--line);stroke-width:1;opacity:.7}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2)} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:13.5px;max-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
[data-tip]{cursor:default}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.map{width:100%;height:auto;max-height:78vh;display:block}
.map .st{fill:var(--map-land);stroke:var(--map-line);stroke-width:.7}
.map .edge{stroke:var(--ink2);stroke-width:1.6;opacity:.5;stroke-linecap:round;fill:none}
.map .edge.dash{stroke-dasharray:4 3}
.map .edge.hot{stroke:var(--info);opacity:1;stroke-width:2.4}
.map .route{stroke:var(--route);stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;cursor:pointer}
.map .dot.hub{fill:var(--ink)} .map .dot.tesla{stroke:var(--route)} .map .dot.sel{fill:var(--stone);stroke:var(--ink);stroke-width:2.4}
.map .lab{font:600 11.5px var(--font-b);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.map .stop{fill:var(--info);stroke:var(--surface);stroke-width:2}
.map .stoplab{font:700 11px var(--font-n);fill:var(--on-info);text-anchor:middle;pointer-events:none}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2);margin-top:8px}
.maplegend span{display:inline-flex;align-items:center;gap:6px}

/* connector schematic */
.conn svg{width:84px;height:84px;flex:none}
.conn .shell{fill:var(--surface2);stroke:var(--ink2);stroke-width:2} .conn .pin{fill:var(--ink)} .conn .big{fill:var(--info)}
.ladder{display:grid;gap:8px}
.ladder .r{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:10px;align-items:center;font-size:14.5px}
.ladder .bar{height:14px;border-radius:7px;background:var(--surface2);position:relative;overflow:hidden}
.ladder .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:7px}

footer{margin-top:60px;padding-block:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media(max-width:560px){.car .facts b{font-size:15.5px}.tabs a{padding-inline:8px}}

/* additions */
.btn.ghost{background:transparent}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks li{margin:0;max-width:none}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:1.4}
.checks input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--nh)}
.rbar{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:15px}
.rbar .bar{height:16px;border-radius:8px;background:var(--surface2);position:relative;overflow:hidden}
.rbar .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.r{text-align:right}
@media(min-width:900px){.cols2.mapcols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.cols2>*,.grid>*{min-width:0}
.pill{white-space:normal;text-align:left}
.conn{min-width:0}
.stack{grid-template-columns:minmax(0,1fr)}
.cols2{grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tools{display:flex;gap:6px;margin-left:auto;align-items:center}
@media(min-width:900px){.tools{margin-left:10px}}
.tbtn{font:600 15px var(--font-n);color:var(--on-nh);background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;min-height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.22)}
.tbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.heart{font-size:22px;line-height:1;min-width:44px;min-height:44px;margin:-8px -8px 0 0;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:10px}
.heart[aria-pressed="true"]{color:var(--bad)}
.livemap{width:100%;height:min(70vh,560px);border:0;border-radius:12px;background:var(--surface2);display:block}
.liveph{display:grid;place-items:center;text-align:center;min-height:240px;padding:24px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2)}

details.chk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;box-shadow:var(--shadow)}
details.chk>summary{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;font:700 21px var(--font-d);padding:12px 0;list-style:none}
details.chk>summary::-webkit-details-marker{display:none}
details.chk[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.chk>ul{padding-bottom:12px}

[data-vis="h3"]{font-size:clamp(22px,3.6vw,27px);letter-spacing:.005em}
[data-vis="h4"]{font-size:19px;letter-spacing:.02em}
@media(max-width:1179px){.brand small{display:none!important}}
@media(min-width:900px) and (max-width:1100px){.tabs a{padding-left:8px;padding-right:8px;font-size:16px}.tools{margin-left:4px}.topbar .wrap{gap:10px}}
.car h4,.car h3[data-vis]{font-size:22px;line-height:1.1;margin:0}
.steps [data-vis]{margin-bottom:3px}

.grid.g4{grid-template-columns:minmax(0,1fr)}
@media(min-width:600px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1040px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* skip link and focus target */
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:8px}
main[tabindex]:focus,main[tabindex]:focus-visible{outline:none}
/* printing */
@media print{
  html,body{background:#fff!important;color:#000!important}
  .topbar,.bottomnav,.skip,.jump,.tools,.chips,iframe,.livemap,#lv-box,#cmpbar,button.chip,[data-go],.btn{display:none!important}
  main.wrap{max-width:none;padding:0}
  .card,.note,details,.tbl,tr,.car{break-inside:avoid;box-shadow:none!important}
  .tbl{overflow:visible!important}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:.8em;word-break:break-all}
  .view[hidden]{display:none!important}
}
/* Windows high-contrast and similar */
@media(forced-colors:active){
  .chip,.btn,.tbtn,.pill,.card,.note,details.chk,.tabs a,.bottomnav a{border:1px solid CanvasText}
  .chip[aria-pressed="true"],.tabs a[aria-current="page"],.bottomnav a[aria-current="page"]{border:2px solid Highlight;forced-color-adjust:none;background:Highlight;color:HighlightText}
  :focus-visible{outline:3px solid Highlight!important}
}

.sb{display:grid;gap:9px;min-width:0}
.sb .sbr{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px;align-items:baseline}
.sb .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.sb .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:4px}
.sb .num{white-space:nowrap;font-variant-numeric:tabular-nums}

.stars{--on:#c27c0e;--off:#c9ced2;letter-spacing:1px;font-size:15px;background:linear-gradient(90deg,var(--on) var(--p),var(--off) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
:root[data-theme="dark"] .stars{--on:#f2b705;--off:#4a5560}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stars{--on:#f2b705;--off:#4a5560}}
@media (forced-colors:active){.stars{background:none;color:CanvasText;-webkit-text-fill-color:CanvasText}}
.own{margin:2px 0}

</style>

/* ===== Pure calculation helpers (no DOM). Tested in Node before the page is built. ===== */
var LOSS = 0.10;           // share of wall electricity lost as heat while charging
var KPK = 6.5;             // typical real km per kWh (median of independently tested cars in this data, 6.45)
var ROAD_FACTOR = 1.15;    // straight-line distance to road distance

function kmhAdded(kw){ return Math.round(kw*(1-LOSS)*KPK/5)*5; } // range added per hour of AC charging, rounded to 5
function carById(id){ for (var i=0;i<CARS.length;i++) if (CARS[i].id===id) return CARS[i]; return null; }

function batClass(b){ return b<=30?'S':b<=45?'M':b<=60?'L':b<=80?'XL':b<=100?'P':'F'; }
var CLASS_LABEL = {S:'Up to 30 kWh',M:'30-45 kWh',L:'45-60 kWh',XL:'60-80 kWh',P:'80-100 kWh',F:'Over 100 kWh'};
function priceBand(p){ return p<10?'b1':p<15?'b2':p<25?'b3':p<50?'b4':p<100?'b5':'b6'; }
var BAND_LABEL = {b1:'Under ₹10 L',b2:'₹10-15 L',b3:'₹15-25 L',b4:'₹25-50 L',b5:'₹50 L-1 Cr',b6:'Over ₹1 Cr'};

function fmtLakh(x){
  if (x>=100){ var cr=x/100; var t=(cr<10?cr.toFixed(2):cr.toFixed(1)); if(t.indexOf('.')>-1) t=t.replace(/0+$/,'').replace(/\.$/,''); return '₹'+t+' Cr'; }
  return '₹'+(Math.round(x*100)/100).toString()+' L';
}
function fmtPrice(c){ return c.p[0]===c.p[1] ? fmtLakh(c.p[0]) : fmtLakh(c.p[0])+' to '+fmtLakh(c.p[1]); }
function fmtRs(x){ // plain rupees with Indian grouping
  x=Math.round(x); var neg=x<0; x=Math.abs(x); var s=x.toString(), last=s.slice(-3), rest=s.slice(0,-3);
  if (rest) rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,','), s=rest+','+last; return (neg?'-':'')+'₹'+s;
}

/* Electricity cost per km for a car at a given ₹/kWh. Uses the tested (or estimated) real range. */
function costPerKm(car, tariff){ if(!car||!car.re) return null; return car.bat*tariff/((1-LOSS)*car.re); }
function kmPerKwh(car){ return (car&&car.re)? car.re/car.bat : null; }

/* DC fast charging.
   Cars with measured times (car.m = [20-80% min, 80-100% min, test charger kW], from Autocar India) use them.
   Other cars: average power from the listed 10-80% time. The last 20% runs at about 28% of that speed;
   measured cars show 16-34% (mean about 28%). Charger power caps both zones at 92% of its rating. */
var TAIL = 0.28;
function dcPowers(car, chargerKw){
  var cap = chargerKw*0.92, pa, pt;
  if (car.m){ pa = 0.6*car.bat/(car.m[0]/60); pt = car.m[1] ? 0.2*car.bat/(car.m[1]/60) : pa*TAIL; }
  else { pa = 0.7*car.bat/(car.dc/60); pt = pa*TAIL; }
  return {pa:Math.min(pa,cap), pt:Math.min(pt,cap), carPa:pa};
}
function dcMinutes(car, fromPct, toPct, chargerKw){
  if(!car||!car.dc) return null;
  var w=dcPowers(car,chargerKw);
  var z1 = Math.max(0, Math.min(toPct,80)-Math.min(fromPct,80))/100*car.bat;
  var z2 = Math.max(0, toPct-Math.max(fromPct,80))/100*car.bat;
  return (z1/w.pa + z2/w.pt)*60;
}
function acHours(batKwh, fromPct, toPct, chargerKw, carAcKw){
  var kw = Math.min(chargerKw, carAcKw);
  return batKwh*Math.max(0,toPct-fromPct)/100/(kw*(1-LOSS));
}
function fmtDur(mins){
  if (mins==null||!isFinite(mins)) return '-';
  var r=Math.round(mins); if (r<60) return Math.max(1,r)+' min';
  var h=Math.floor(r/60), m=r%60;
  return h+' h'+(m?' '+m+' min':'');
}

/* ---- Battery rental (BaaS) versus buying ---- */
function emiRate(pv, emi, n){ // monthly rate that makes the loan fit; bisection
  if (emi*n<=pv) return 0; var lo=0, hi=0.05;
  for (var k=0;k<80;k++){ var mid=(lo+hi)/2, v=emi*(1-Math.pow(1+mid,-n))/mid; if (v>pv) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
function loanBalance(pv, emi, i, m){ if (i<1e-12) return Math.max(0,pv-emi*m); return pv*Math.pow(1+i,m) - emi*(Math.pow(1+i,m)-1)/i; }

/* o = {car, kmYear, years, moneyRate (annual, fraction), resalePct (fraction of price paid)}.
   Two views:  cash paid so far (simple chart)  and  a fair end-of-period cost that adds what your money
   could have earned and subtracts what the car sells for. */
function baasCompare(o){
  var b=o.car.baas, diff=(b.own-b.price)*1e5, r=o.moneyRate, out={type:b.type, diff:diff, car:o.car};
  var kmMonth=o.kmYear/12, rm=Math.pow(1+r,1/12)-1, resale=o.resalePct==null?0.5:o.resalePct;
  var cash, flows;   // flows(m) = BaaS payment in month m (1-based)
  if (b.type==='A'){
    var billed=Math.max(kmMonth,b.minKm||0); out.billedKm=billed; out.rentMonth=billed*b.perKm; out.minApplies = kmMonth<(b.minKm||0);
    out.breakEvenKm = diff/b.perKm; out.breakEvenYears = diff/b.perKm/Math.max(o.kmYear,1);
    out.breakEvenYearsBilled = diff/(out.rentMonth*12);
    flows=function(){ return out.rentMonth; };
    cash=function(y){ return b.price*1e5 + out.rentMonth*12*y; };
    out.exit=function(){ return 0; };
  } else {
    var emi=b.perKm*(b.basis||1800), n=96, i=emiRate(diff,emi,n);
    out.emi=emi; out.n=n; out.impliedAnnual=(Math.pow(1+i,12)-1); out.totalPaid=emi*n; out.i=i;
    out.incomplete = emi*n < diff;   // quoted payments add up to less than the battery's price: the real loan terms must differ
    flows=function(m){ return m<=n?emi:0; };
    out.exit=function(y){ var m=Math.round(y*12); return m>=n?0:loanBalance(diff,emi,i,m); };
    cash=function(y){ var m=Math.round(y*12); return b.price*1e5 + emi*Math.min(m,n) + out.exit(y); };
  }
  out.ownCash=function(){ return b.own*1e5; };
  out.baasCash=cash;
  out.crossYears=null;
  for (var m2=1;m2<=15*12;m2++){ var y=m2/12; if (cash(y)>b.own*1e5){ out.crossYears=y; break; } }
  // fair comparison at the chosen horizon
  var Y=o.years, M=Math.round(Y*12), g=Math.pow(1+rm,M);
  var ownFair=b.own*1e5*g - resale*b.own*1e5;
  var baasFair=b.price*1e5*g - resale*b.price*1e5;
  for (var m=1;m<=M;m++) baasFair += flows(m)*Math.pow(1+rm,M-m);
  baasFair += out.exit(Y);
  out.ownFair=ownFair; out.baasFair=baasFair; out.fairDiff=baasFair-ownFair; // positive: BaaS costs more
  out.exitBalanceAt=out.exit(Y);
  return out;
}

/* ---- EV vs petrol running cost ---- */
function runningCost(o){ // o: kmMonth, petrolPrice, petrolKmpl, evKmPerKwh, homeShare, homeTariff, dcTariff
  var petrol=o.kmMonth/o.petrolKmpl*o.petrolPrice;
  var perKm=(o.homeShare*o.homeTariff+(1-o.homeShare)*o.dcTariff)/((1-LOSS)*o.evKmPerKwh);
  var ev=o.kmMonth*perKm;
  return {petrol:petrol, ev:ev, evPerKm:perKm, petrolPerKm:petrol/o.kmMonth, save:petrol-ev};
}

/* ---- Map: projection fitted to the outline (Mercator, checked against Delhi, Chandigarh, Goa, Kanyakumari) ---- */
var MAP_W=612, MAP_H=696, LON0=68.16, MAP_K=611.9/(97.4-68.16);
function _merc(lat){ return Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)); }
var _Y0=_merc(37.1), _KY=MAP_K*180/Math.PI;
function mapXY(lat,lon){ return [(lon-LON0)*MAP_K, (_Y0-_merc(lat))*_KY]; }
function haversine(a,b){
  var R=6371, toR=Math.PI/180, dLa=(b.la-a.la)*toR, dLo=(b.lo-a.lo)*toR;
  var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.la*toR)*Math.cos(b.la*toR)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
var _adj=null;
function _buildGraph(){
  _adj={}; for (var k in NODES) _adj[k]=[];
  EDGES.forEach(function(e){ var d=haversine(NODES[e[0]],NODES[e[1]])*ROAD_FACTOR; _adj[e[0]].push({to:e[1],d:d,name:e[2]}); _adj[e[1]].push({to:e[0],d:d,name:e[2]}); });
}
function shortestPath(from,to){
  if(!_adj) _buildGraph();
  var dist={}, prev={}, done={}, q=[]; for (var k in NODES) dist[k]=Infinity; dist[from]=0; q.push(from);
  while(q.length){
    q.sort(function(a,b){return dist[a]-dist[b];}); var u=q.shift(); if(done[u]) continue; done[u]=1; if(u===to) break;
    _adj[u].forEach(function(e){ var nd=dist[u]+e.d; if(nd<dist[e.to]){dist[e.to]=nd; prev[e.to]={from:u,name:e.name,d:e.d}; q.push(e.to);} });
  }
  if(dist[to]===Infinity) return null;
  var path=[to], segs=[]; var c=to; while(c!==from){ var p=prev[c]; segs.unshift({a:p.from,b:c,d:p.d,name:p.name}); c=p.from; path.unshift(c); }

}
/* Place a point d km along the route: returns lat/lon and the nearest named node */
function pointAlong(route, d){
  var acc=0;
  for (var i=0;i<route.segs.length;i++){
    var s=route.segs[i];
    if (d<=acc+s.d || i===route.segs.length-1){
      var t=Math.max(0,Math.min(1,(d-acc)/s.d)), A=NODES[s.a], B=NODES[s.b];
      return {la:A.la+(B.la-A.la)*t, lo:A.lo+(B.lo-A.lo)*t, near:(t<0.5?A.nm:B.nm), corridor:s.name};
    }
    acc+=s.d;

}
/* Trip plan: highwayFactor scales the tested (mixed) range down for steady 100+ km/h driving */
function tripPlan(o){ // o: car, km, startPct, factor, chargerKw, tariff
  var c=o.car; if(!c||!c.re||!c.dc) return {ok:false};
  var real=c.re*o.factor, usable=real*0.70, leg1=real*Math.max(0,(o.startPct-10)/100);

  var chargeMin=stops*(perStopMin+plug);
  var energyDC = stops? Math.min(stops*0.7*c.bat, (o.km-leg1)/real*c.bat):0;
  return {ok:true, real:real, usable:usable, leg1:leg1, stops:stops, perStopMin:perStopMin, chargeMin:chargeMin,
          driveMin:o.km/75*60, totalMin:o.km/75*60+chargeMin, dcCost:energyDC/(1-LOSS)*o.tariff, energyDC:energyDC};
}

/* ---- Car finder score ---- */
function scoreCar(c,need){ // need: budget, seats, dailyKm, tripsPerMonth
  if (!c.re || c.p[0]>need.budget || c.seats<need.seats) return null;
  var must=Math.max(need.dailyKm*2.5,120); if (need.trips>0) must=Math.max(must,330); if (need.trips>=4) must=Math.max(must,400);
  var rangeS=Math.min(c.re/must,1.4)/1.4;
  var eff=Math.min((c.re/c.bat)/10,1);
  var value=Math.min((c.re/c.p[0])/45,1);
  var safety=/5★/.test(c.ncap)?1:(/Tested|Rated/.test(c.ncap)?0.8:0.45);
  var wr=/Lifetime|15 yr/.test(c.wr)?1:/8 yr/.test(c.wr)?0.65:0.4;
  var chg=c.dc? Math.max(0,Math.min(1,(70-c.dc)/50)) : 0;
  var wChg = need.trips>0 ? 0.14 : 0.06;
  var s=0.30*rangeS+0.18*eff+0.14*value+0.14*safety+0.10*wr+wChg*chg;
  var rw=c.rk==='T'?'Tested':'Estimated', why=[]; if (c.re>=must*1.15) why.push(rw+' range of '+c.re+' km covers your driving with room to spare');
  else if (c.re>=must) why.push(rw+' range of '+c.re+' km just covers your needs');
  else why.push(rw+' range of '+c.re+' km is short for your trips. Plan charging stops');
  if (/5★/.test(c.ncap)) why.push('5-star crash rating'); if (/Lifetime|15 yr/.test(c.wr)) why.push('Long battery warranty');
  if (eff>0.78) why.push('Very efficient ('+(c.re/c.bat).toFixed(1)+' km per kWh)');
  if (c.dc && c.dc<=25) why.push('Fast DC charging ('+(c.meas?'measured':c.dce?'class estimate':'maker figure')+': about '+c.dc+' min for 10-80%)');
  return {car:c, score:s, why:why, short:c.re<must};
}

var GLOSS=[
['Battery','kWh (kilowatt-hour)','The size of the battery. Think of it as the fuel tank in litres. A 50 kWh battery holds about twice as much energy as a 25 kWh one. Most tested cars here use roughly 5 to 11 km of range per kWh.'],
['Charging','kW (kilowatt)','The speed of energy flow. Think of the tap or the pump nozzle. Higher kW fills the tank faster. Rule of thumb: hours to fill = kWh ÷ kW. A 50 kWh battery on a 7 kW charger needs about 7 hours (a bit more with losses).'],
['Battery','Gross vs usable capacity','Gross is the total the battery can hold. Usable is what the car lets you use, keeping a safety buffer at both ends. Brands quote them differently. For example, a pack sold as 64 kWh may give 60 kWh usable. Always ask which one a number means.'],
['Battery','Range (claimed)','The distance the maker says a full battery covers, from a lab test. In India it is usually the ARAI or MIDC figure. Imported cars often quote the WLTP figure. You will almost never get this number in daily use.'],
['Battery','Range (real-world)','What independent testers measure on real roads with traffic and highway speeds. In this guide it is mostly 65% to 90% of the claim. Plan with this number, not the brochure.'],
['Driving','Efficiency (km per kWh)','Like km per litre. Higher is better. The best tested here is the MG Comet at about 11 km/kWh. The Creta Electric gets 8.4. A heavy SUV like the Harrier EV AWD gets 5.35. A smaller battery in an efficient car can beat a bigger battery in a heavy one.'],
['Battery','SoC (state of charge)','The fuel gauge in percent. 80% means the battery is four-fifths full.'],
['Battery','SoH (state of health)','How much capacity the battery still has compared with new. 100% is brand new. Tata’s warranty promises repair or replacement if it falls below 70% during the cover period. A 50 kWh pack at 80% SoH holds about 40 kWh.'],
['Battery','Degradation','The slow, normal loss of battery capacity over the years. Heat, frequent fast charging, and sitting at 100% or near 0% for long all speed it up.'],
['Battery','Cell, module, pack','Small cells are grouped into modules, and modules into the pack under the floor. Ask whether the pack can be repaired by replacing a module or only as a whole unit.'],
['Battery','LFP and NMC','The two common battery chemistries. See the comparison table below. Ask the dealer which one your car has.'],
['Battery','BMS (battery management system)','The battery’s brain. It watches every cell, keeps them balanced, protects against heat and over-charging, and estimates the range you see on the screen.'],
['Battery','Thermal management','Cooling (and sometimes heating) of the battery. Liquid cooling helps in Indian summers and during fast charging. Heat is the battery’s biggest enemy.'],
['Battery','Cycle','One full charge and discharge worth of energy. Two 50% top-ups count as one cycle. Warranties often quote years and km instead of cycles.'],
['Battery','Vampire drain','A small amount of charge lost while the car is parked and locked, because the computers stay on. Usually small, but it adds up over weeks of parking.'],
['Charging','AC charging','Alternating current from the wall. The car’s own onboard charger converts it to battery power. Slower, gentle, and what you use at home and at many public points.'],
['Charging','DC fast charging','The charger converts the power itself and feeds the battery directly, so it can be much faster. Used on highways. Costs more per unit.'],
['Charging','Onboard charger (OBC)','The converter inside the car that limits how fast AC charging can go. Most Indian EVs top out at 7.2 kW or 11 kW, so a 22 kW public AC point will not charge them any faster.'],
['Charging','Charging curve and taper','Fast charging is quick up to about 80%, then slows a lot to protect the battery. In Autocar India’s tests, the last 20% (80 to 100%) took 30 to 36 minutes on most cars, about as long as the 60% before it. This is why people stop at 80% on trips.'],
['Charging','10-80% time','The number to compare when buying. It tells you how long a typical highway stop takes. Be careful: some brands quote 20-80%, which is shorter.'],
['Charging','Peak vs average speed','A car may hit 150 kW for a moment but average only 90 kW across the stop. Look at measured 10-80% times, not the peak.'],
['Charging','400V and 800V','The battery’s system voltage. 800V cars (such as the Ioniq 5 and Mercedes GLC Electric) can hold very fast charging speeds for longer, if the charger is powerful enough.'],
['Charging','CCS2, Type 2, 15A socket','The plug shapes. Almost every EV on sale in India uses one port that takes Type 2 (AC) and CCS2 (DC fast). See the Charging tab for pictures.'],
['Charging','CPO (charge point operator)','The company that runs a public charger, such as Tata Power EZ Charge, ChargeZone or Statiq. Each has its own app and prices.'],
['Charging','Idle or parking fee','A fee some stations charge if you leave the car plugged in after charging ends, or park for long. Amounts differ by operator.'],
['Charging','Pre-conditioning','Warming or cooling the battery to the right temperature before a fast charge. Some cars do it automatically when you navigate to a charger. It saves time and protects the battery.'],
['Driving','Regenerative braking (regen)','When you lift your foot, the motor works backwards as a generator and puts a little energy back into the battery. It also slows the car and saves brake pads.'],
['Driving','One-pedal driving','A strong regen setting where lifting off the accelerator slows the car firmly, even to a stop. After a week most people drive with one pedal in the city.'],
['Driving','Instant torque','Electric motors deliver full pulling power from standstill. EVs feel quick off the line even when they are not sports cars.'],
['Driving','Single-speed gearbox','Most EVs have no gears to change. You select D and go. That is why they are smooth and why there is no clutch.'],
['Driving','V2L (vehicle to load)','A feature that lets the car power appliances, like a laptop, a kettle or camping gear, from its battery. Not every car has it, so ask.'],
['Driving','OTA update','Over-the-air software update, like on a phone. It can improve range, charging or screens. Ask how well the brand has supported earlier updates.'],
['Driving','12V battery','EVs still carry a small ordinary battery for lights, locks and screens. It can fail like any car battery, so it is checked at service.'],
['Buying','Ex-showroom price','The price before registration, road tax and insurance. The on-road price is higher. Always ask for the on-road price in writing.'],
['Buying','BaaS (battery as a service)','A scheme where you buy the car at a lower price and pay for the battery separately. In India it works two ways, covered in the Money tab.'],
['Buying','IDV (insured declared value)','The value your insurer uses for the car. Owners report that for BaaS cars it is worked out on the full price, battery included.'],
['Buying','ARAI and Bharat NCAP','ARAI tests range and efficiency in a lab. Bharat NCAP is India’s crash-test programme that gives star ratings out of 5.'],
['Buying','e-AMRIT','The government’s EV information portal. It has a charging map and other buying information.']
];

  /* quiz */
  '<section class="sec" id="learn-quiz">'+secHead('', 'Step 1 · Four questions', 'Does an EV fit my life?','The biggest factor is not the car. It is where you can plug it in. Answer these and see. The answers below are an example to start.')+
  '<div class="cols2 lop"><div class="card stack" id="quiz">'+
   quizQ('park','Where does your car sleep at night?',[['own','Own parking with a plug point nearby'],['society','Society or flat parking, needs RWA approval'],['street','Street or no fixed spot']],'own')+
   quizQ('daily','How far do you drive on a normal day?',[['low','Under 40 km'],['mid','40 to 100 km'],['high','Over 100 km']],'low')+
   quizQ('trips','How often do you take long trips (300 km or more)?',[['rare','Hardly ever'],['some','A few times a year'],['often','Every month or more']],'some')+

  '</div><div id="quizOut"></div></div></section>'+

  /* how it works */
  '<section class="sec" id="learn-works">'+secHead('','Step 2 · The basics','How an electric car works','Fewer parts than a petrol car, and every one has an easy match.')+
  '<div class="card" style="margin-bottom:14px">'+workDiagram()+'</div>'+
  '<div class="grid">'+[
   ['Fuel tank → Battery','A big battery pack sits under the floor. It stores electricity instead of petrol. It is measured in kWh.'],
   ['Engine → Electric motor','The motor turns the wheels. It has very few moving parts, so it is quiet and responds instantly.'],
   ['Gearbox → One gear','No clutch and no gear changes. You press D and go.'],
   ['Petrol pump → A plug','Most charging happens at home overnight. Fast chargers are for highway trips.'],
   ['Brakes → Regen + brakes','Lifting off the pedal recovers energy. Brake pads last longer.'],
   ['Servicing → Much lighter','No engine oil, spark plugs, clutch or exhaust. You still need tyres, brakes, coolant, cabin filters, suspension and a yearly check of the high-voltage system.']
  ].map(function(x){return '<div class="card flat"><h4>'+x[0]+'</h4><p class="small muted" style="margin-top:6px">'+x[1]+'</p></div>';}).join('')+'</div></section>'+

  /* glossary */
  '<section class="sec" id="learn-words">'+secHead('','Step 3 · The language','Battery and charging words','Tap a word to read it. Filter by topic or search.')+
  '<div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:6px">Tank and tap: kWh vs kW</h3>'+
  '<p class="small muted">This is the single most useful idea. kWh is the size of the tank. kW is the speed of the tap. Move the sliders.</p>'+
  '<div class="fgrid"><div class="field"><div class="lab">Battery size</div><div class="val" id="tt-bv"></div><input type="range" id="tt-b" min="10" max="120" step="0.5" value="51.4" aria-label="Battery size in kWh"></div>'+
  '<div class="field"><label for="tt-c">Charger speed</label><select id="tt-c">'+[[2.5,'2.5 kW · wall socket'],[3.3,'3.3 kW · portable charger'],[7.2,'7.2 kW · home wallbox'],[11,'11 kW · public AC'],[30,'30 kW · slow DC'],[60,'60 kW · DC fast'],[120,'120 kW · fast'],[240,'240 kW · ultra-fast']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===7.2?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div></div>'+
  '<div class="row" style="margin-top:12px;gap:18px" aria-live="polite"><div class="stat"><div class="v" id="tt-out">-</div><div class="l">Empty to full, roughly</div></div><div class="small muted" id="tt-txt" style="flex:1;min-width:220px"></div></div></div>'+
  '<div class="row" style="margin-bottom:10px"><input type="search" id="gl-q" placeholder="Search a word, like SoH or regen" aria-label="Search the glossary" style="flex:1;min-width:200px;max-width:340px"><div class="row" id="gl-f">'+['All','Battery','Charging','Driving','Buying'].map(function(t,i){return '<button class="chip" data-gf="'+t+'" aria-pressed="'+(i===0)+'">'+t+'</button>';}).join('')+'</div></div>'+
  '<div class="card flat" style="padding:4px 16px" id="gl-list"></div></section>'+

  /* chemistry */
  '<section class="sec" id="learn-chem">'+secHead('','Step 4 · Two chemistries','LFP vs NMC: what is inside the battery','Brands rarely shout about this, but it changes how you should charge. These are general battery facts, not figures from a single car. Always follow your owner’s manual.')+
  '<div class="tbl"><table><thead><tr><th><span class="sr">Feature</span></th><th>LFP (lithium iron phosphate)</th><th>NMC / NCA (nickel-based)</th></tr></thead><tbody>'+
  [['Good at','Long life, many cycles, stable, usually cheaper','More energy for its weight, so more range per kg'],
   ['Weak at','Heavier for the same energy','Prefers not to sit at 100%, a bit more fussy in heat'],
   ['Daily charging','Many makers allow charging to 100% regularly','Daily limit of about 80-90% is common; 100% only before a trip'],
   ['How to know','Ask the dealer and read the manual','Same: ask for the chemistry and the daily charge limit in writing']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join('')+'</tbody></table></div></section>'+

  /* km left */
  '<section class="sec" id="learn-left">'+secHead('','Step 5 · Reading the meter','How many km do I have left?','Your car works this out itself. Knowing how helps you judge when to believe it.')+
  '<div class="cols2 lop"><div class="card stack">'+
  '<h3>The car’s guess</h3>'+
  '<p class="small" style="margin:0">The car takes the battery percentage, turns it into kWh, and multiplies by your recent km per kWh (usually your last 20 to 50 km). Some cars also count the AC and outside temperature. So the number is a guess based on how you have been driving.</p>'+
  '<ul class="small" style="margin:0;padding-left:18px;display:grid;gap:5px"><li><b>Fast highway driving</b> uses more energy, so the km number falls quickly.</li><li><b>Gentle city driving or a downhill</b> makes it climb.</li><li><b>AC, heat and cold</b> push it down.</li><li>After days of slow city use, the car assumes you will keep doing that and shows a flattering number.</li></ul>'+
  '<div class="note info"><span class="lbl">Trust the percentage</span><p>The percentage is more reliable than the km figure. Plan trips by percentage, and never plan to arrive below 10%. Keep 15 to 20% spare.</p></div>'+
  '</div>'+
  '<div class="card stack"><h3>Work it out yourself</h3>'+
  '<p class="small muted" style="margin:0">Km left = battery size (kWh) × % left × km per kWh</p>'+
  '<div class="field"><label for="lf-car">Pick a car (optional)</label><select id="lf-car"><option value="">Use my own battery size</option>'+CARS.filter(function(c){return c.bat&&c.re;}).map(function(c){return '<option value="'+c.id+'">'+esc(c.br+' '+c.nm)+' · '+c.bat+' kWh</option>';}).join('')+'</select></div>'+
  '<div class="fgrid"><div class="field"><div class="lab">Battery size</div><div class="val" id="lf-bv"></div><input type="range" id="lf-b" min="10" max="120" step="0.5" value="40" aria-label="Battery size in kWh for the range-left calculator"></div>'+
  '<div class="field"><div class="lab">Battery left</div><div class="val" id="lf-pv"></div><input type="range" id="lf-p" min="5" max="100" step="1" value="60" aria-label="Battery percentage left"></div></div>'+
  '<div class="field"><label for="lf-s">How are you driving?</label><select id="lf-s">'+[[7,'Gentle city driving · 7 km/kWh'],[6,'Mixed city and road · 6 km/kWh'],[4.5,'Fast highway · 4.5 km/kWh'],[3.5,'Fast highway, hot day with AC · 3.5 km/kWh']].map(function(o,i){return '<option value="'+o[0]+'"'+(i===1?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>'+
  '<div class="row" style="gap:18px" aria-live="polite"><div class="stat"><div class="v" id="lf-out">-</div><div class="l">Km left, roughly</div></div><div class="stat"><div class="v" id="lf-safe">-</div><div class="l">Usable, keeping 15% spare</div></div></div>'+
  '<p class="small muted" style="margin:0" id="lf-txt"></p></div></div></section>'+

  /* range */
  '<section class="sec" id="learn-range">'+secHead('','Step 6 · Range','Claimed vs real range','Light bar is the maker’s claim. Dark bar is what independent tests measured. Hover or tap a bar for details.')+
  '<div class="card">'+chart+'<div class="legend" style="margin-top:8px"><span><i style="background:var(--s1-soft)"></i>Claimed (ARAI / MIDC)</span><span><i style="background:var(--s1)"></i>Tested on real roads</span></div></div>'+
  '<div class="cols2" style="margin-top:14px"><div class="note info"><span class="lbl">Simple rule</span><p>Plan with about 65% to 90% of the claimed range. Efficient cars like the Creta Electric and MG Windsor came close to their claims. Big SUVs fell further short.</p></div>'+
  '<div class="note warn"><span class="lbl">Stops are shorter than range</span><p>You rarely drive from 100% to 0%. If you charge between 20% and 80%, the distance between stops is about 60% of the full range. Always keep a buffer.</p></div></div>'+
  note('info','How the tested number is made','<p>Most tested figures here come from Autocar India. In its XEV 9e test it drove a fixed city loop and a fixed highway loop with the AC at 22°C, then worked out the range from the share of charge used. The result is a blend of city and highway, so think of it as a middle value, not a limit. Heat, traffic and a heavy car push it down. Mild weather and steady driving can beat it, and fast highway driving can fall below it. Other testers use other methods, so numbers differ by source. Where a test reports the city and highway split, the car card shows it.</p>').replace('class="note info"','class="note info" style="margin-top:14px"')+'</section>'+

  /* driving */
  '<section class="sec" id="learn-drive">'+secHead('','Step 7 · On the road','Driving your first EV','What feels different in the first week.')+
  '<div class="grid">'+[
   ['It is quiet and quick','Full pulling power from zero. Pull out of junctions smoothly and without a gearbox jerk. Watch your speed in the city because it builds up quietly.'],
   ['Try one-pedal driving','Set regen to the stronger setting and let the accelerator do the braking. Keep your foot ready for the real brake pedal.'],
   ['Speed costs range','Steady 80-90 km/h uses much less energy than 110+ km/h. Fast highway driving is where real range falls furthest from the claim.'],
   ['Heavy loads and hills','Full seats, roof boxes and long climbs use more energy. Going downhill gives some back through regen.'],
   ['Tyres matter','Correct tyre pressure helps range. Check it as often as you would on a petrol car.'],
   ['Pre-cool while plugged in','Cool the cabin while still connected to the charger so the battery does not pay for it. AC itself is a modest drain.']
  ].map(function(x){return '<div class="card flat"><h4>'+x[0]+'</h4><p class="small muted" style="margin-top:6px">'+x[1]+'</p></div>';}).join('')+'</div></section>'+

  /* care */
  '<section class="sec" id="learn-care">'+secHead('','Step 8 · Habits','Looking after the battery','The battery is the costly part. These habits are free. Battery life is commonly 8 to 15 years, and warranties are now long: 8 years or 1.6 lakh km at most brands; lifetime cover for the first owner on some Tata, Mahindra and MG models, with conditions.')+
  '<div class="cols2"><div class="card"><h3 style="color:var(--good)">Do</h3><ul>'+
   ['Plug in at home when it suits you. You do not need to wait for it to run low.','Follow the daily charge limit in your owner’s manual. Charge to 100% only before a long trip, and leave soon after.','Park in shade in summer. Heat ages a battery faster than anything else.','Use fast chargers for trips. Occasional fast charging is normal.','Keep software updated and go to the authorised service centre for the yearly high-voltage check.','Use branded, certified cables and chargers only.'].map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>'+
  '<div class="card"><h3 style="color:var(--bad)">Avoid</h3><ul>'+
   ['Leaving the car at 100% or near 0% for days.','Fast charging again and again when the battery is hot or nearly full. It adds stress.','Cheap knock-off cables or adapters. They are a fire risk.','Plugging a high-power charger into an old, worn 15A socket and leaving it all night. Have an electrician check the wiring first.','Driving into deep water. Batteries are sealed, but a high-voltage pack is not made for wading.','Letting someone not trained in high-voltage systems open the battery or orange cables.'].map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div></div>'+
  '<div class="note warn" style="margin-top:14px"><span class="lbl">Read your warranty</span><p>Lifetime warranties have conditions: usually the first private owner only, with servicing at authorised centres. Tata’s “lifetime” means 15 years from first registration with a minimum 70% battery health. Get the exact wording in writing.</p></div></section>'+

  /* myths */
  '<section class="sec" id="learn-myths">'+secHead('','Step 9 · Straight talk','Myths and facts','')+
  '<div class="card flat" style="padding:4px 16px">'+[
   ['“EVs cannot do highways.”','The best tested cars run 450 to 500 km on real roads (XEV 9S 478 km, Ioniq 5 501 km). Roughly 91% of national highways have a charger about every 50 km, though coverage is uneven. Rajasthan, the hills and some east-coast stretches are thin. Check the Map tab and plan.'],
   ['“The battery will die in 3-4 years.”','Warranties of 8 years / 1.6 lakh km are standard, and some brands offer lifetime cover for the first owner. Typical life is 8 to 15 years. Batteries age slowly, and what you lose is range, not the car.'],
   ['“EVs are too expensive.”','The sticker can be higher for the same size, but EVs pay only 5% GST and cost about ₹1 to ₹1.5 per km at home, against ₹6 to ₹8 per km for petrol. The Money tab does the maths with your numbers.'],
   ['“Public chargers are everywhere.”','Not yet. Roughly 1 public charger serves about 235 EVs, and about 18% of installed stations were not working in March 2026. Home or workplace charging is what makes EV ownership easy.'],
   ['“Rain is dangerous.”','Charging in the rain is normal if the cable and socket are undamaged. Avoid flooded roads. A sealed battery is not a boat.'],
   ['“EVs catch fire.”','Most home charging trouble comes from worn sockets, poor wiring and cheap chargers, not from the car. Use certified gear, a dedicated breaker and written proof of earthing.']
  ].map(function(m){return '<details><summary>'+m[0]+'</summary><div><p>'+m[1]+'</p></div></details>';}).join('')+'</div></section>';
}

  return '<svg class="chart" viewBox="0 0 640 230" role="img" aria-label="Diagram: charging port feeds the battery, which powers an inverter, motor and wheels. Braking sends energy back to the battery.">'+

   box(14,78,96,64,'Charging','port','var(--info-bg)')+box(150,60,130,100,'Battery pack','stores kWh','var(--s1-soft)')+box(320,78,104,64,'Inverter','DC to AC')+box(460,78,80,64,'Motor','')+box(576,86,52,48,'Wheels','')+
   arr(110,110,148,110)+arr(280,110,318,110)+arr(424,110,458,110)+arr(540,110,574,110)+
   '<path d="M600 140 C600 200 330 206 215 164" fill="none" stroke="var(--s2)" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ahr)"/>'+
   '<text x="410" y="198" text-anchor="middle" style="fill:var(--s2);font-weight:600;font-size:12.5px">Regenerative braking sends energy back</text>'+
   '<text x="64" y="160" text-anchor="middle" style="font-size:11.5px">home or fast charger</text>'+
   '<rect x="150" y="12" width="130" height="30" rx="8" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="215" y="31" text-anchor="middle" style="font-size:12px">12V battery for lights, locks</text></svg>';

function bindLearn(){
  /* quiz */
  var qa={park:'own',daily:'low',trips:'some',only:'yes'};
  function quiz(){
    var park=qa.park, d=qa.daily, t=qa.trips, only=qa.only, kind,title,body;
    var need=d==='low'?150:d==='mid'?250:400; if(t==='some') need=Math.max(need,330); if(t==='often') need=Math.max(need,400);
    var cta='<div class="row" style="margin-top:12px"><button class="btn pri" data-go="cars">See cars with ≥ '+need+' km range</button><button class="btn" data-go="charging">Home charging guide</button></div>';
    if(park==='street'){ kind='bad'; title='Wait, or fix charging first';
      body='<p>With no fixed spot you would depend on public chargers. They cost about ₹3 to ₹5 per km on DC fast, against ₹1 to ₹1.5 at home, and about 18% of installed stations were not working in March 2026.</p><p>Before buying, ask whether your office, a nearby society or a fuel station can give you a reliable, regular charging spot.</p>'; }
    else if(park==='society'){ kind='warn'; title='Possible, once your society agrees';
      body='<p>Talk to the RWA before you book. Most electricity companies now have an EV connection process, and newer societies are adding charging points. A 3.3 kW portable charger on a safe, certified socket is enough for about 12 to 18 km of range per hour.</p>'+(only==='yes'&&(t==='often'||d==='high')?'<p>Because this is your only car and you drive a lot, wait until the charging point is approved in writing.</p>':''); }
    else if(only==='yes'&&(t==='often'||d==='high')){ kind='warn'; title='Good fit, with planning';
      body='<p>Home charging makes daily driving cheap. For frequent long trips choose a car that has been tested above 400 km, one that fast-charges quickly, and learn the route planner on the Map tab. Keep one charging app on your phone for each major network.</p>'; }
    else { kind='good'; title='A very good fit';
      body='<p>You can charge at home and your driving suits an EV. Most of your charging will cost about ₹1 to ₹1.5 per km. Even small-battery cars will work for your daily routine.</p>'; }
    $('#quizOut').innerHTML=note(kind, kind==='good'?'Result':kind==='warn'?'Result: plan first':'Result: not yet', '<h3 style="margin:2px 0 8px">'+title+'</h3>'+body+cta);
  }
  $$('#quiz .seg').forEach(function(seg){ seg.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; $$('button',seg).forEach(function(x){x.setAttribute('aria-pressed',x===b);}); qa[seg.getAttribute('data-q')]=b.getAttribute('data-v'); quiz(); }); });
  quiz();
  /* tank & tap */
  function tt(){ var b=num('tt-b',50), kw=num('tt-c',7.2); $('#tt-bv').textContent=b+' kWh'; var hrs=b/(kw*(1-LOSS)); var min=hrs*60;
    $('#tt-out').textContent=kw>=30? fmtDur(min*(1+0.25))+' *' : fmtDur(min);
    $('#tt-txt').textContent=kw>=30? '* A fast charger fills 10 to 80% much quicker, then slows down for the last part. Your car’s own limit also applies, so see the Charging tab for a car-specific calculator.' : 'Time is kWh ÷ kW, plus about 10% lost as heat. If your car can only accept 7.2 kW, a faster AC point will not help.'; }
  $('#tt-b').addEventListener('input',tt); $('#tt-c').addEventListener('change',tt); tt();
  /* km left */
  function lf(){ var b=num('lf-b',40), pc=num('lf-p',60), e=num('lf-s',6); $('#lf-bv').textContent=b+' kWh'; $('#lf-pv').textContent=pc+'%';
    var left=Math.round(b*pc/100*e/5)*5, safe=Math.max(0,Math.round(b*(pc-15)/100*e/5)*5);
    $('#lf-out').textContent=left+' km'; $('#lf-safe').textContent=safe+' km';
    var cid=$('#lf-car').value, c=cid?carById(cid):null;
    $('#lf-txt').textContent=(c&&c.re?c.br+' '+c.nm+' tested about '+(Math.round(c.re/c.bat*10)/10)+' km per kWh in mixed driving. ':'')+'Rounded to 5 km. Real roads vary, so treat this as a guide, not a promise.'; }
  $('#lf-car').addEventListener('change',function(){ var c=this.value?carById(this.value):null; if(c){ $('#lf-b').value=c.bat; } lf(); });
  $('#lf-b').addEventListener('input',lf); $('#lf-p').addEventListener('input',lf); $('#lf-s').addEventListener('change',lf); lf();
  /* glossary */
  var gf='All';
  function gl(){ var q=$('#gl-q').value.trim().toLowerCase(); var list=GLOSS.filter(function(g){return (gf==='All'||g[0]===gf)&&(!q||(g[1]+' '+g[2]).toLowerCase().indexOf(q)>-1);});
    $('#gl-list').innerHTML=list.length? list.map(function(g){return '<details><summary><span>'+esc(g[1])+' <span class="pill" style="margin-left:6px">'+g[0]+'</span></span></summary><div><p>'+g[2]+'</p></div></details>';}).join('') : '<p class="muted" style="padding:14px 0">No word matches. Try fewer letters.</p>'; }
  $('#gl-q').addEventListener('input',gl);
  $('#gl-f').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; gf=b.getAttribute('data-gf'); $$('#gl-f .chip').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); gl(); });
  gl();
}

function styleBars(c){
  if(!c.rs) return '<span class="muted">'+(c.rk==='T'?'The test published only one blended figure.':'No split available. This is an estimate.')+'</span>';
  var top=Math.max(c.cl||0,c.rs[0],c.rs[1],c.re), rows=[['City loop',c.rs[0]],['Blend (tested)',c.re],['Highway loop',c.rs[1]]];

    cmpUi();
  }
  ['x-q','x-b','x-body','x-seat','x-fast','x-sort','x-t'].forEach(function(id){ document.getElementById(id).addEventListener('input',list); });
  $('#x-fav').addEventListener('click',function(){ CS.favOnly=!CS.favOnly; this.setAttribute('aria-pressed',CS.favOnly); list(); });
  $('#x-cls').addEventListener('click',function(e){ var b=e.target.closest('[data-cls]'); if(!b) return; var k=b.getAttribute('data-cls'), i=CS.classes.indexOf(k); if(i>-1) CS.classes.splice(i,1); else CS.classes.push(k); b.setAttribute('aria-pressed',i<0); list(); });

function curveChart(){
  var W=640,H=260,L=44,R=14,T=14,B=38,iw=W-L-R,ih=H-T-B;
  function X(p){return L+iw*p/100;} function Y(v){return T+ih-ih*v/100;}
  function pw(p){ if(p<10) return 62+p*2.3; if(p<=55) return 85+(p-10)*0.0; if(p<=80) return 85-(p-55)*1.0; return 60-(p-80)*2.0; }
  var d=''; for (var p=0;p<=100;p+=2) d+=(d?'L':'M')+X(p).toFixed(1)+' '+Y(pw(p)).toFixed(1);
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Illustration: charging power stays high until about 55 percent then falls, dropping sharply after 80 percent.">';
  out+='<rect x="'+X(10)+'" y="'+T+'" width="'+(X(80)-X(10))+'" height="'+ih+'" fill="var(--info-bg)" rx="6"/>';
  [0,25,50,75,100].forEach(function(v){ out+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/>'; });
  [0,20,40,60,80,100].forEach(function(p){ out+='<text x="'+X(p)+'" y="'+(H-20)+'" text-anchor="middle">'+p+'%</text>'; });
  out+='<text x="'+(L-6)+'" y="'+(T+4)+'" text-anchor="end">peak</text><text x="'+(L-6)+'" y="'+(T+ih)+'" text-anchor="end">0</text>';
  out+='<text x="'+(X(45))+'" y="'+(T+16)+'" text-anchor="middle" class="t1" style="font-size:12.5px">Best stop zone: 10 to 80%</text>';
  out+='<path d="'+d+'" fill="none" stroke="var(--s1)" stroke-width="3" stroke-linejoin="round"/>';
  out+='<circle cx="'+X(80)+'" cy="'+Y(pw(80))+'" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>';

function bindCharging(){
  var type='ac';
  var AC=[[3.3,'3.3 kW · portable'],[7.2,'7.2 kW · wallbox'],[11,'11 kW · public AC'],[22,'22 kW · public AC']];
  var DC=[[25,'25 kW · slow DC'],[30,'30 kW'],[60,'60 kW · DC fast'],[120,'120 kW · fast'],[150,'150 kW · fast'],[180,'180 kW · fast'],[240,'240 kW · ultra-fast'],[360,'360 kW · ultra-fast (rare)']];
  function fillKw(){ var cur=type==='ac'?7.2:60; $('#c-kw').innerHTML=(type==='ac'?AC:DC).map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join(''); $('#c-p').value=type==='ac'?8:24; }
  function carChanged(){ var c=carById($('#c-car').value); $('#c-ack').value=c.ac; calc(); }
  function calc(){
    var c=carById($('#c-car').value), f=num('c-f',20), t=num('c-t',80); if(t<=f){ t=Math.min(100,f+5); $('#c-t').value=t; }
    $('#c-fv').textContent=f+'%'; $('#c-tv').textContent=t+'%'; var kw=num('c-kw',7.2), price=num('c-p',8), kwh=c.bat*(t-f)/100, out='';
    var km=c.re?Math.round(kwh*c.re/c.bat):null;
    if(type==='dc'&&!c.dc){ $('#c-out').innerHTML='<div class="note warn" style="flex:1"><span class="lbl">No fast charging</span><p>The '+esc(c.br+' '+c.nm)+' charges on AC only. Choose AC, or pick another car.</p></div>'; return; }
    var mins=type==='dc'? dcMinutes(c,f,t,kw) : acHours(c.bat,f,t,kw,num('c-ack',c.ac))*60;
    var lim=type==='ac'&&kw>num('c-ack',c.ac);
    out='<div class="stat"><div class="v">'+fmtDur(mins)+'</div><div class="l">Time</div></div><div class="stat"><div class="v">'+kwh.toFixed(1)+' kWh</div><div class="l">Energy added</div></div>'+(km?'<div class="stat"><div class="v">~'+km+' km</div><div class="l">Range added</div></div>':'')+'<div class="stat"><div class="v">'+fmtRs(kwh/(1-LOSS)*price)+'</div><div class="l">Cost</div></div>';
    out+='<div class="small muted" style="flex-basis:100%;margin:0">'+(lim?'Your car accepts only '+num('c-ack',c.ac)+' kW on AC, so the charger runs at that limit. ':'')+(type==='dc'&&kw>(0.7*c.bat/(c.dc/60))*1.4?'The charger is more powerful than the car can use, so the car sets the speed. ':'')+(type==='dc'&&t>80?'Above 80% the charger slows to about a third of the speed. ':'')+(c.dce&&type==='dc'?'This car’s fast-charging time is a class estimate. ':'')+'</div>';
    $('#c-out').innerHTML=out;
  }
  $('#c-car').addEventListener('change',carChanged);
  $('#c-type').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; type=b.getAttribute('data-v'); $$('#c-type button').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); fillKw(); calc(); });
  ['c-kw','c-ack','c-f','c-t','c-p'].forEach(function(id){ document.getElementById(id).addEventListener('input',calc); });
  fillKw(); carChanged();
  /* home planner */
  function home(){
    var c=carById($('#h-car').value), d=num('h-d',40), p=num('h-p',8); $('#h-dv').textContent=d+' km';
    var kwh=d/(c.re/c.bat)/(1-LOSS), h33=kwh/Math.min(3.3,c.ac), h72=kwh/Math.min(7.2,c.ac), cost=kwh*p, month=cost*30;
    var verdict= h33<=9 ? note('good','Fits overnight','<p>Even a plain 3.3 kW portable charger refills a day’s driving overnight.</p>') : h72<=9 ? note('warn','Wallbox recommended','<p>The portable charger needs '+h33.toFixed(1)+' hours. A 7.2 kW wallbox does it in '+h72.toFixed(1)+' hours.</p>') : note('bad','Needs a bigger plan','<p>Even a 7.2 kW wallbox takes '+h72.toFixed(1)+' hours. Add workplace or public charging, or choose a car with a faster AC charger.</p>');
    $('#h-out').innerHTML='<div class="row" style="gap:22px"><div class="stat"><div class="v">'+kwh.toFixed(1)+'</div><div class="l">kWh per day</div></div><div class="stat"><div class="v">'+fmtRs(month)+'</div><div class="l">Per month</div></div><div class="stat"><div class="v">₹'+(cost/d).toFixed(2)+'</div><div class="l">Per km</div></div></div>'+
      '<div class="tinted small">Portable 3.3 kW: <b>'+fmtDur(h33*60)+'</b> · Wallbox 7.2 kW: <b>'+fmtDur(h72*60)+'</b>'+(c.ac<7.2?' <span class="muted">(this car’s AC limit is '+c.ac+' kW)</span>':'')+'</div>'+verdict;
  }
  ['h-car','h-d','h-p'].forEach(function(id){ document.getElementById(id).addEventListener('input',home); }); home();

    q=String(q||'').trim().slice(0,120); if(!q){ $('#lv-msg').textContent='Type a city or area first.'; return; }
    $('#lv-q').value=q; $('#lv-msg').textContent='Showing chargers near '+q+'.';
    var box=$('#lv-box');
    if(LIVE_EMBED){ box.className=''; box.innerHTML=''; var f=document.createElement('iframe'); f.className='livemap'; f.title='Google Maps: EV charging stations near '+q; f.loading='lazy'; f.referrerPolicy='no-referrer'; f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups'); f.src=gmUrl(q,true); box.appendChild(f); }
    else { box.className='liveph'; box.innerHTML='<div><p class="small" style="margin:0 0 10px;max-width:46ch">The embedded map is switched off in this view. Open it in Google Maps instead.</p><a class="btn pri" target="_blank" rel="noopener noreferrer" href="'+gmUrl(q,false)+'">Open Google Maps for '+esc(q)+'</a></div>'; }
    $('#lv-links').innerHTML='<a class="btn sm" target="_blank" rel="noopener noreferrer" href="'+gmUrl(q,false)+'">Open full map</a><a class="btn sm" target="_blank" rel="noopener noreferrer" href="https://www.plugshare.com/">PlugShare</a><a class="btn sm" target="_blank" rel="noopener noreferrer" href="https://evyatra.beeindia.gov.in/">BEE EV Yatra (government)</a>';
    $$('#lv-chips .chip').forEach(function(c){ c.setAttribute('aria-pressed',c.getAttribute('data-city')===q); });
  }
  window.liveSearch=liveSearch;
  $('#lv-go').addEventListener('click',function(){ liveSearch($('#lv-q').value); });
  $('#lv-q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); liveSearch($('#lv-q').value); } });
  $('#lv-chips').addEventListener('click',function(e){ var b=e.target.closest('[data-city]'); if(b) liveSearch(b.getAttribute('data-city')); });
  $('#lv-loc').addEventListener('click',function(){
    var msg=$('#lv-msg'); if(!navigator.geolocation){ msg.textContent='Your browser cannot share your location. Type a city instead.'; return; }
    msg.textContent='Asking your device for your location…';
    try{ navigator.geolocation.getCurrentPosition(function(pos){ liveSearch(pos.coords.latitude.toFixed(4)+','+pos.coords.longitude.toFixed(4)); $('#lv-q').value=''; msg.textContent='Showing chargers near your location.'; },function(){ msg.textContent='Location was not shared. Type a city instead.'; },{timeout:10000,maximumAge:600000}); }catch(e){ msg.textContent='Location is not available here. Type a city instead.'; }
  });
  function plan(){
    var a=$('#p-from').value, b=$('#p-to').value, c=carById($('#p-car').value), s=num('p-s',90), f=num('p-f',85);
    $('#p-sv').textContent=s+'%'; $('#p-fv').textContent=f+'%';
    var rg=$('#routeg'); rg.innerHTML=''; var out=$('#p-out');
    if(a===b){ out.innerHTML=note('warn','Pick two places','<p>Start and end are the same.</p>'); return; }
    var r=shortestPath(a,b); if(!r){ out.innerHTML=note('warn','No road found','<p>This map has no connection between these two places.</p>'); return; }
    var t=tripPlan({car:c,km:r.km,startPct:s,factor:f/100,chargerKw:num('p-kw',120),tariff:num('p-t',24)});
    if(!t.ok){ out.innerHTML=note('warn','Not possible','<p>This car cannot fast charge, so it is not suited for highway trips.</p>'); return; }
    var pts=r.nodes.map(function(k){var P=mapXY(NODES[k].la,NODES[k].lo); return P[0].toFixed(1)+','+P[1].toFixed(1);}).join(' ');
    var svg='<polyline class="route" points="'+pts+'"/>';
    var stops=[]; for (var i=0;i<t.stops;i++){ var d=Math.min(r.km-5,t.leg1+i*t.usable); var p=pointAlong(r,d); stops.push({d:d,p:p}); var P=mapXY(p.la,p.lo); svg+='<circle class="stop" cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="9"/><text class="stoplab" x="'+P[0].toFixed(1)+'" y="'+(P[1]+4).toFixed(1)+'">'+(i+1)+'</text>'; }
    [a,b].forEach(function(k,ix){ var P=mapXY(NODES[k].la,NODES[k].lo); svg+='<circle cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="7" fill="var(--route)" stroke="var(--surface)" stroke-width="2"/><text class="lab" x="'+(P[0]+10).toFixed(1)+'" y="'+(P[1]-8).toFixed(1)+'">'+(ix?'End: ':'Start: ')+esc(NODES[k].nm)+'</text>'; });
    rg.innerHTML=svg;
    var roads=[]; r.segs.forEach(function(sg){ if(roads[roads.length-1]!==sg.name) roads.push(sg.name); });
    var h='<div class="card stack"><div class="row" style="gap:22px">'+
      '<div class="stat"><div class="v">'+Math.round(r.km)+' km</div><div class="l">Distance (estimate)</div></div>'+
      '<div class="stat"><div class="v">'+(t.stops?t.stops:'None')+'</div><div class="l">Fast-charge stops</div></div>'+
      '<div class="stat"><div class="v">'+fmtDur(t.totalMin)+'</div><div class="l">Total time</div></div>'+
      '<div class="stat"><div class="v">'+(t.stops?fmtRs(t.dcCost):'—')+'</div><div class="l">Fast charge cost</div></div></div>'+
      '<p class="small muted" style="margin:0">Road: '+esc(roads.join(' → '))+'. Highway range for this car: about '+Math.round(t.real)+' km (full), '+Math.round(t.usable)+' km between 80% and 10%.</p></div>';
    if(!t.stops) h+=note('good','No stop needed','<p>You can drive this on one charge and still arrive with about 10% left. Carry a portable charger, and top up if you can at the other end.</p>');
    else {
      h+='<div class="card"><h3 data-vis="h4" style="margin-bottom:8px">Your stops</h3><ol class="steps">'+stops.map(function(sp,i){ var near=sp.p.near;
        return '<li><div class="stone" aria-hidden="true"><i></i><b>'+(i+1)+'</b></div><div><b>Around km '+Math.round(sp.d)+', near '+esc(near)+'</b><div class="small muted">'+esc(sp.p.corridor)+'. Charge 10→80%: about '+fmtDur(t.perStopMin)+' plus plug-in time. Find an exact charger on the app, and look for a second option nearby.</div></div></li>'; }).join('')+'</ol></div>';
      if(t.perStopMin>50) h+=note('info','Slow charging car','<p>This car needs '+fmtDur(t.perStopMin)+' per stop. A faster charger will not help much because the car sets the pace.</p>');
    }
    h+=note('warn','Check before you go','<p>Distances are estimates from straight lines. Charger working status changes daily. Open the live map for each stop, and have a backup within 30 km.</p>')+'<div class="card stack"><h3 data-vis="h4">See live chargers</h3>'+liveLinks(NODES[a])+'</div>';
    out.innerHTML=h;
  }
  ['p-from','p-to','p-car','p-s','p-f','p-kw','p-t'].forEach(function(id){ document.getElementById(id).addEventListener('input',plan); });
  $('#p-swap').addEventListener('click',function(){ var x=$('#p-from').value; $('#p-from').value=$('#p-to').value; $('#p-to').value=x; plan(); });
  plan();
}

function bindMoney(){

      '<h3>Every month</h3>'+
      '<div class="rbar"><div class="lab">Petrol</div><div class="bar"><i style="width:'+(r.petrol/max*100)+'%;background:var(--s2)"></i></div><div class="num">'+fmtRs(r.petrol)+'</div></div>'+
      '<div class="rbar"><div class="lab">'+esc(c.nm)+'</div><div class="bar"><i style="width:'+(r.ev/max*100)+'%;background:var(--s1)"></i></div><div class="num">'+fmtRs(r.ev)+'</div></div>'+
      '<div class="row" style="gap:22px"><div class="stat"><div class="v">'+fmtRs(r.save)+'</div><div class="l">Saved per month</div></div><div class="stat"><div class="v">'+fmtRs(r.save*12)+'</div><div class="l">Saved per year</div></div><div class="stat"><div class="v">₹'+r.evPerKm.toFixed(2)+'</div><div class="l">EV per km (petrol ₹'+r.petrolPerKm.toFixed(2)+')</div></div></div>'+
      (pay? note(pay<=5?'good':pay<=9?'warn':'bad','Payback',  '<p>The extra price of ₹'+(prem/1e5)+' L comes back in about <b>'+pay.toFixed(1)+' years</b> from fuel savings alone.'+(pay>8?' That is long. Look at the cheaper end of the market, or consider whether road-tax savings change this.':'')+'</p>') : note('bad','No saving','<p>With these numbers the EV does not save money on fuel. Try more home charging.</p>'))+

    if(b.type==='A'){
      h+='<p class="small" style="margin:0">You pay ₹'+b.perKm+' per km. Billed at least '+b.minKm.toLocaleString('en-IN')+' km a month. Your driving is '+Math.round(k/12).toLocaleString('en-IN')+' km a month'+(o.minApplies?', so you are billed for the minimum: <b>'+fmtRs(o.rentMonth)+' a month</b>.':': <b>'+fmtRs(o.rentMonth)+' a month</b>.')+'</p>'+
        '<div class="tinted small">Rent matches the upfront saving after about <b>'+Math.round(o.breakEvenKm).toLocaleString('en-IN')+' km</b> of billed driving, which is <b>'+o.breakEvenYearsBilled.toFixed(1)+' years</b> at your pace.</div>';

        ((y*12<o.n)? '<div class="tinted small">If you sell at year '+y+', about <b>'+fmtRs(o.exitBalanceAt)+'</b> of battery loan is still due.</div>':'');
    }

    h+='<p class="tiny muted" style="margin:0">The verdict adds what your money could earn, and subtracts the resale value (which is a share of the price you paid for the car). It is a guide, not a quote.</p>';
    $('#b-out').innerHTML=h;
    var maxY=Math.max(y,8), ch=lineChart('bch',[{name:'Own',color:'var(--s1)',f:function(t){return o.ownCash();}},{name:'Rent',color:'var(--s2)',f:function(t){return o.baasCash(t);}}],maxY);
    $('#b-chart').innerHTML=ch.svg; ch.bind();
  }
  ['b-car','b-k','b-y','b-r','b-s'].forEach(function(id){ document.getElementById(id).addEventListener('input',baas); }); baas();
}
